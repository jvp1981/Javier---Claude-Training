<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>₿ BTC Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0;padding:0;box-sizing:border-box; }
        :root {
            --bg:#080c10; --surface:#0d1117; --surface2:#161b22; --surface3:#21262d;
            --border:rgba(255,255,255,0.07);
            --accent:#f7931a; --accent-dim:rgba(247,147,26,0.15); --accent-glow:rgba(247,147,26,0.4);
            --green:#3fb950; --green-dim:rgba(63,185,80,0.12);
            --red:#f85149;   --red-dim:rgba(248,81,73,0.12);
            --yellow:#e3b341;
            --text:#e6edf3;  --text-muted:#7d8590; --text-dim:#484f58;
            --chf:#29b6f6;   --chf-dim:rgba(41,182,246,0.12);
        }
        @keyframes fadeUp   { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
        @keyframes glow-orange {
            0%,100%{box-shadow:0 0 20px var(--accent-glow)}
            50%{box-shadow:0 0 50px var(--accent-glow),0 0 100px rgba(247,147,26,0.2)}
        }
        @keyframes pricePop { 0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)} }
        @keyframes spin  { to{transform:rotate(360deg)} }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        body {
            font-family:'Syne',sans-serif; background:var(--bg); color:var(--text);
            min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
            padding:30px 20px 60px; position:relative; overflow-x:hidden;
        }
        body::before {
            content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
            background-image:linear-gradient(rgba(247,147,26,0.03) 1px,transparent 1px),
                             linear-gradient(90deg,rgba(247,147,26,0.03) 1px,transparent 1px);
            background-size:40px 40px;
        }
        body::after {
            content:''; position:fixed; left:0; right:0; height:3px; pointer-events:none; z-index:0;
            background:linear-gradient(transparent,rgba(247,147,26,0.08),transparent);
            animation:scanline 8s linear infinite;
        }
        .container { max-width:680px; width:100%; position:relative; z-index:1; animation:fadeUp 0.5s ease-out; }

        /* ── HEADER ── */
        .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid var(--border); }
        .header-left { display:flex; align-items:center; gap:14px; }
        .btc-badge { width:48px; height:48px; background:var(--accent-dim); border:1px solid rgba(247,147,26,0.3); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; animation:glow-orange 3s ease-in-out infinite; }
        .header-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
        .header-sub { font-family:'Space Mono',monospace; font-size:11px; color:var(--text-muted); margin-top:2px; letter-spacing:1px; }
        .live-badge { display:flex; align-items:center; gap:6px; font-family:'Space Mono',monospace; font-size:11px; color:var(--green); background:var(--green-dim); padding:6px 12px; border-radius:20px; border:1px solid rgba(63,185,80,0.2); }
        .live-dot { width:6px; height:6px; background:var(--green); border-radius:50%; animation:blink 1.5s ease-in-out infinite; }

        /* ── PRICE ── */
        .price-section { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px; margin-bottom:16px; position:relative; overflow:hidden; }
        .price-section::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:0.6; }
        .price-row { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:20px; }
        .price-label { font-family:'Space Mono',monospace; font-size:11px; color:var(--text-muted); letter-spacing:1.5px; margin-bottom:6px; }
        .price-usd { font-family:'Space Mono',monospace; font-size:54px; font-weight:700; color:var(--text); letter-spacing:-2px; line-height:1; transition:color 0.3s; }
        .price-usd.pop  { animation:pricePop 0.4s ease-out; }
        .price-usd.up   { color:var(--green); }
        .price-usd.down { color:var(--red); }
        .price-chf-block { text-align:right; }
        .price-chf { font-family:'Space Mono',monospace; font-size:28px; font-weight:700; color:var(--chf); letter-spacing:-1px; line-height:1; }
        .chf-rate-note { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); margin-top:4px; }
        .change-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .change-pill { display:inline-flex; align-items:center; gap:6px; font-family:'Space Mono',monospace; font-size:13px; font-weight:700; padding:6px 14px; border-radius:8px; }
        .change-pill.pos { background:var(--green-dim); color:var(--green); border:1px solid rgba(63,185,80,0.25); }
        .change-pill.neg { background:var(--red-dim); color:var(--red); border:1px solid rgba(248,81,73,0.25); }
        .change-pill.neu { background:var(--surface2); color:var(--text-muted); border:1px solid var(--border); }
        .sparkline-row { display:flex; align-items:center; gap:8px; margin-top:14px; }
        .sparkline-lbl { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); white-space:nowrap; }

        /* ── STATS ── */
        .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
        @media(max-width:560px){ .stats-grid{grid-template-columns:repeat(2,1fr);} }
        .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
        .stat-label { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); letter-spacing:0.8px; margin-bottom:6px; }
        .stat-value { font-family:'Space Mono',monospace; font-size:14px; font-weight:700; color:var(--text); }

        /* ── INDICATORS — 2x2 grid ── */
        .indicators-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
        @media(max-width:560px){ .indicators-grid{grid-template-columns:1fr;} }
        .indicator-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px; }
        .indicator-label { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); letter-spacing:1px; margin-bottom:10px; }
        .indicator-main { display:flex; align-items:center; gap:12px; }
        .indicator-score { font-family:'Space Mono',monospace; font-size:30px; font-weight:700; line-height:1; flex-shrink:0; }
        .indicator-name { font-size:13px; font-weight:700; color:var(--text); margin-bottom:3px; display:flex; align-items:center; gap:6px; }
        .indicator-sub  { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-muted); }
        /* Semaphore dot */
        .semaphore  { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
        .sem-green  { background:var(--green);  box-shadow:0 0 7px var(--green); }
        .sem-yellow { background:var(--yellow); box-shadow:0 0 7px var(--yellow); }
        .sem-red    { background:var(--red);    box-shadow:0 0 7px var(--red); }
        /* Score colors */
        .score-green  { color:var(--green); }
        .score-yellow { color:var(--yellow); }
        .score-red    { color:var(--red); }
        .score-chf    { color:var(--chf); }
        /* F&G bar */
        .fg-bar-wrap  { margin-top:10px; }
        .fg-bar-track { height:3px; background:var(--surface3); border-radius:2px; overflow:hidden; }
        .fg-bar-fill  { height:100%; border-radius:2px; transition:width 0.6s ease; }
        /* RSI bar */
        .rsi-bar-wrap  { margin-top:10px; position:relative; height:6px; background:linear-gradient(90deg,#3fb950 0%,#3fb950 30%,#e3b341 30%,#e3b341 55%,#f97316 55%,#f97316 75%,#f85149 75%); border-radius:3px; overflow:visible; }
        .rsi-needle    { position:absolute; top:-3px; width:3px; height:12px; background:#fff; border-radius:2px; transform:translateX(-50%); transition:left 0.6s ease; box-shadow:0 0 4px rgba(0,0,0,0.6); }

        /* ── PORTFOLIO ── */
        .portfolio-section { background:var(--surface); border:1px solid rgba(247,147,26,0.25); border-radius:20px; padding:24px 28px; margin-bottom:16px; position:relative; overflow:hidden; }
        .portfolio-section::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),var(--chf),transparent); opacity:0.7; }
        .portfolio-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
        .portfolio-title { font-size:13px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px; }
        .portfolio-title::before { content:'◈'; color:var(--accent); font-size:16px; }
        .btc-input-wrap { display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:6px 12px; transition:border-color 0.2s; }
        .btc-input-wrap:focus-within { border-color:rgba(247,147,26,0.5); }
        .btc-input-label { font-family:'Space Mono',monospace; font-size:11px; color:var(--accent); font-weight:700; }
        .btc-input { background:transparent; border:none; outline:none; font-family:'Space Mono',monospace; font-size:14px; font-weight:700; color:var(--text); width:90px; text-align:right; }
        .btc-input::placeholder { color:var(--text-dim); }
        .portfolio-values { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media(max-width:560px){ .portfolio-values{grid-template-columns:1fr;} }
        .portfolio-val-card { background:var(--surface2); border-radius:12px; padding:16px 18px; border:1px solid var(--border); }
        .portfolio-val-label  { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); letter-spacing:1px; margin-bottom:6px; }
        .portfolio-val-amount { font-family:'Space Mono',monospace; font-size:22px; font-weight:700; letter-spacing:-0.5px; }
        .portfolio-val-card.chf-val .portfolio-val-amount { color:var(--chf); }
        .portfolio-val-card.usd-val .portfolio-val-amount { color:var(--accent); }
        .portfolio-val-sub { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); margin-top:4px; }
        .portfolio-empty { font-family:'Space Mono',monospace; font-size:12px; color:var(--text-dim); text-align:center; padding:8px 0 4px; }

        /* ── DCA ── */
        .dca-section { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:22px 24px; margin-bottom:16px; }
        .dca-header  { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
        .dca-title   { font-size:13px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px; }
        .dca-title::before { content:'⬇'; color:var(--chf); font-size:14px; }
        .dca-subtitle { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-muted); }
        .dca-levels  { display:flex; flex-direction:column; gap:8px; }
        .dca-level   { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:center; padding:12px 14px; background:var(--surface2); border-radius:10px; border:1px solid var(--border); }
        .dca-level.reached { border-color:rgba(63,185,80,0.35); background:rgba(63,185,80,0.06); }
        .dca-top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
        .dca-input-wrap { display:flex; align-items:center; gap:5px; background:var(--surface3); border:1px solid var(--border); border-radius:7px; padding:4px 9px; transition:border-color 0.2s; }
        .dca-input-wrap:focus-within { border-color:rgba(41,182,246,0.5); }
        .dca-currency-lbl { font-family:'Space Mono',monospace; font-size:10px; color:var(--chf); font-weight:700; }
        .dca-price-input  { background:transparent; border:none; outline:none; font-family:'Space Mono',monospace; font-size:13px; font-weight:700; color:var(--text); width:64px; text-align:right; }
        .dca-price-input::placeholder { color:var(--text-dim); }
        .dca-bar-track { height:4px; background:var(--surface3); border-radius:2px; overflow:hidden; margin:4px 0; }
        .dca-bar-fill  { height:100%; border-radius:2px; background:linear-gradient(90deg,var(--chf),var(--green)); transition:width 0.8s ease; }
        .dca-pct-row   { display:flex; align-items:center; justify-content:space-between; }
        .dca-pct       { font-family:'Space Mono',monospace; font-size:11px; font-weight:700; }
        .dca-action    { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); }
        .dca-level.reached .dca-action { color:var(--green); }

        /* ── CHART ── */
        .chart-section  { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:24px; margin-bottom:16px; }
        .chart-header   { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; }
        .chart-title    { font-size:14px; font-weight:700; color:var(--text); }
        .chart-subtitle { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); margin-top:3px; }
        .chart-wrapper  { position:relative; height:240px; margin-top:16px; }
        .chart-loading  { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-size:12px; color:var(--text-muted); gap:10px; }
        .mini-spinner   { width:18px; height:18px; border:2px solid var(--surface3); border-top-color:var(--chf); border-radius:50%; animation:spin 0.8s linear infinite; }

        /* ── FOOTER ── */
        .footer-bar     { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--surface); border:1px solid var(--border); border-radius:14px; }
        .update-info    { display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:11px; color:var(--text-muted); }
        .countdown-wrap { display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:11px; color:var(--text-muted); }
        .countdown-circle { width:34px; height:34px; position:relative; }
        .countdown-svg { transform:rotate(-90deg); }
        .cc-bg   { fill:none; stroke:var(--surface3); stroke-width:3; }
        .cc-prog { fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
        .cc-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:10px; font-weight:700; color:var(--accent); font-family:'Space Mono',monospace; }

        /* ── MISC ── */
        .loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:16px; }
        .spinner-lg     { width:44px; height:44px; border:3px solid var(--surface3); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
        .loading-text   { font-family:'Space Mono',monospace; font-size:13px; color:var(--text-muted); }
        .error-banner   { background:var(--red-dim); border:1px solid rgba(248,81,73,0.3); border-radius:12px; padding:10px 16px; font-family:'Space Mono',monospace; font-size:11px; color:var(--red); margin-bottom:14px; }

        /* ── REALIZED PRICE MANUAL EDIT ── */
        .rp-value-row   { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
        .rp-edit-btn    { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); background:var(--surface3); border:1px solid var(--border); border-radius:6px; padding:3px 8px; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
        .rp-edit-btn:hover { color:var(--chf); border-color:rgba(41,182,246,0.4); }
        .rp-input-row   { display:flex; align-items:center; gap:6px; margin-top:8px; }
        .rp-input       { flex:1; background:var(--surface3); border:1px solid rgba(41,182,246,0.4); border-radius:7px; padding:5px 9px; font-family:'Space Mono',monospace; font-size:13px; font-weight:700; color:var(--text); outline:none; }
        .rp-save-btn    { font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:#000; background:var(--chf); border:none; border-radius:7px; padding:5px 12px; cursor:pointer; }
        .rp-updated     { font-family:'Space Mono',monospace; font-size:9px; color:var(--text-dim); margin-top:4px; }
        .rp-empty       { font-family:'Space Mono',monospace; font-size:11px; color:var(--text-dim); padding-top:4px; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const PRICE_INTERVAL = 10000;
const delay = ms => new Promise(r => setTimeout(r, ms));

async function apiFetch(url, timeoutMs = 9000) {
    const ctrl = new AbortController();
    const to   = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(to);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    } catch(e) { clearTimeout(to); throw e; }
}

// ── RSI calculation (Wilder's smoothed method) ───────────────
function calcRSI(prices, period = 14) {
    if (prices.length < period + 1) return null;
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) {
        const diff = prices[i] - prices[i - 1];
        if (diff > 0) gains  += diff;
        else          losses -= diff;
    }
    let avgGain = gains  / period;
    let avgLoss = losses / period;
    for (let i = period + 1; i < prices.length; i++) {
        const diff = prices[i] - prices[i - 1];
        avgGain = (avgGain * (period - 1) + Math.max(diff, 0)) / period;
        avgLoss = (avgLoss * (period - 1) + Math.max(-diff, 0)) / period;
    }
    if (avgLoss === 0) return 100;
    return 100 - (100 / (1 + avgGain / avgLoss));
}

// Default DCA levels in CHF
const DEFAULT_DCA = ['45000','40000','35000','30000'];

function BTCTracker() {
    const [priceData,    setPriceData]    = useState(null);
    const [prevPrice,    setPrevPrice]    = useState(null);
    const [chfRate,      setChfRate]      = useState(null);
    const [annualData,   setAnnualData]   = useState(null);
    const [trend,        setTrend]        = useState('neutral');
    const [loading,      setLoading]      = useState(true);
    const [priceError,   setPriceError]   = useState(null);
    const [lastUpdate,   setLastUpdate]   = useState(null);
    const [sparkHistory, setSparkHistory] = useState([]);
    const [countdown,    setCountdown]    = useState(10);
    const [isPulsing,    setIsPulsing]    = useState(false);

    // Indicators
    const [fearGreed,    setFearGreed]    = useState(null);
    const [mayerMult,    setMayerMult]    = useState(null);
    const [weeklyRSI,    setWeeklyRSI]    = useState(null);
    const [realizedPrice,setRealizedPrice]= useState(() => {
        try { return localStorage.getItem('realizedPrice') || ''; } catch(_) { return ''; }
    });
    const [rpUpdatedAt,  setRpUpdatedAt]  = useState(() => {
        try { return localStorage.getItem('rpUpdatedAt') || ''; } catch(_) { return ''; }
    });
    const [rpEditing,    setRpEditing]    = useState(false);
    const [rpDraft,      setRpDraft]      = useState('');

    // Portfolio
    const [btcAmount,    setBtcAmount]    = useState(() => {
        try { return localStorage.getItem('btcAmount') || ''; } catch(_) { return ''; }
    });

    // DCA levels — 4 editable CHF values
    const [dcaLevels,    setDcaLevels]    = useState(() => {
        try {
            const saved = localStorage.getItem('dcaLevels');
            return saved ? JSON.parse(saved) : [...DEFAULT_DCA];
        } catch(_) { return [...DEFAULT_DCA]; }
    });

    // Chart
    const [chartData,    setChartData]    = useState(null);
    const [chartLoading, setChartLoading] = useState(false);
    const chartInst = useRef(null);
    const canvasRef = useRef(null);

    // Persist
    useEffect(() => { try { localStorage.setItem('btcAmount', btcAmount); } catch(_){} }, [btcAmount]);
    useEffect(() => { try { localStorage.setItem('dcaLevels', JSON.stringify(dcaLevels)); } catch(_){} }, [dcaLevels]);
    useEffect(() => { try { localStorage.setItem('realizedPrice', realizedPrice); } catch(_){} }, [realizedPrice]);
    useEffect(() => { try { localStorage.setItem('rpUpdatedAt', rpUpdatedAt); } catch(_){} }, [rpUpdatedAt]);

    const saveRealizedPrice = () => {
        const v = parseFloat(rpDraft.replace(/[^0-9.]/g, ''));
        if (v > 0) {
            setRealizedPrice(String(Math.round(v)));
            const now = new Date().toLocaleDateString('es-ES', {day:'2-digit',month:'short',year:'numeric'});
            setRpUpdatedAt(now);
        }
        setRpEditing(false);
        setRpDraft('');
    };

    const updateDcaLevel = (idx, val) => {
        setDcaLevels(prev => { const n = [...prev]; n[idx] = val; return n; });
    };

    // ── 1. Live price ────────────────────────────────────────────
    const fetchPrice = useCallback(async () => {
        try {
            const data = await apiFetch(
                'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,chf&include_24hr_change=true&include_24hr_vol=true&include_market_cap=true&include_24hr_high=true&include_24hr_low=true'
            );
            const btc  = data.bitcoin;
            const rate = (btc.chf && btc.usd) ? btc.chf / btc.usd : null;
            setChfRate(rate);
            if (prevPrice !== null) {
                setTrend(btc.usd > prevPrice ? 'up' : btc.usd < prevPrice ? 'down' : 'neutral');
                setIsPulsing(true);
                setTimeout(() => setIsPulsing(false), 400);
            }
            setPrevPrice(btc.usd);
            setPriceData(btc);
            setSparkHistory(prev => [...prev, btc.usd].slice(-20));
            setLastUpdate(new Date());
            setLoading(false);
            setPriceError(null);
            setCountdown(10);
        } catch(e) {
            setPriceError('Error de conexión. Reintentando...');
            setLoading(false);
        }
    }, [prevPrice]);

    // ── 2. Secondary data — 3 staggered calls ────────────────────
    useEffect(() => {
        let cancelled = false;
        async function loadSecondary() {

            // Call A: Fear & Greed (different domain, no CoinGecko rate limit)
            try {
                const fg = await apiFetch('https://api.alternative.me/fng/?limit=1');
                if (!cancelled) setFearGreed(fg.data[0]);
            } catch(_) {}

            await delay(3000); if (cancelled) return;

            // Call B: 365d daily → chart · annual high/low · Mayer · Weekly RSI
            try {
                setChartLoading(true);
                const hist = await apiFetch(
                    'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily'
                );
                if (!cancelled) {
                    const prices = hist.prices;
                    const vals   = prices.map(([,p]) => p);
                    const n      = vals.length;

                    setAnnualData({ high: Math.max(...vals), low: Math.min(...vals) });
                    setChartData(prices);
                    setChartLoading(false);

                    // Mayer Multiple: current price / 200-day MA
                    const ma200slice = vals.slice(-200);
                    const ma200 = ma200slice.reduce((a,b) => a+b, 0) / ma200slice.length;
                    setMayerMult(vals[n-1] / ma200);

                    // Weekly RSI: resample 365 daily points → ~52 weekly closes → RSI(14)
                    const weekly = [];
                    for (let i = 0; i < n; i += 7) weekly.push(vals[i]);
                    weekly.push(vals[n-1]);
                    const rsi = calcRSI(weekly, 14);
                    if (rsi !== null) setWeeklyRSI(rsi);
                }
            } catch(_) { if (!cancelled) setChartLoading(false); }


        }
        loadSecondary();
        return () => { cancelled = true; };
    }, []);

    // ── 3. Price interval ────────────────────────────────────────
    useEffect(() => {
        fetchPrice();
        const iv = setInterval(fetchPrice, PRICE_INTERVAL);
        return () => clearInterval(iv);
    }, [prevPrice]);

    useEffect(() => {
        if (loading || !priceData) return;
        const t = setInterval(() => setCountdown(c => c <= 1 ? 10 : c - 1), 1000);
        return () => clearInterval(t);
    }, [loading, priceData]);

    // ── 4. Chart (1Y portfolio in CHF) ───────────────────────────
    useEffect(() => {
        if (!chartData || !canvasRef.current || !chfRate) return;
        if (chartInst.current) { chartInst.current.destroy(); chartInst.current = null; }

        const btcQty = parseFloat(btcAmount) || 1;
        const values = chartData.map(([,p]) => Math.round(p * chfRate * btcQty));
        const labels = chartData.map(([ts]) => {
            const d = new Date(ts);
            return d.toLocaleDateString('es-ES', { month:'short', day:'numeric' });
        });

        const ctx  = canvasRef.current.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 240);
        grad.addColorStop(0, 'rgba(41,182,246,0.2)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');

        chartInst.current = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    data: values,
                    borderColor: '#29b6f6',
                    borderWidth: 2,
                    backgroundColor: grad,
                    fill: true,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    pointHoverBackgroundColor: '#29b6f6',
                    tension: 0.3,
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                animation: { duration: 400 },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor:'#161b22', borderColor:'rgba(255,255,255,0.1)', borderWidth:1,
                        titleColor:'#7d8590', bodyColor:'#e6edf3',
                        titleFont:{family:"'Space Mono',monospace",size:10},
                        bodyFont: {family:"'Space Mono',monospace",size:13,weight:'700'},
                        callbacks: {
                            label: c => {
                                const v = c.parsed.y;
                                if (v >= 1000000) return ' CHF '+(v/1000000).toFixed(3)+'M';
                                return ' CHF '+v.toLocaleString('es-ES');
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        ticks:{ color:'#484f58', font:{family:"'Space Mono',monospace",size:9}, maxTicksLimit:12, maxRotation:0 },
                        grid: { color:'rgba(255,255,255,0.04)' },
                        border:{ color:'rgba(255,255,255,0.07)' }
                    },
                    y: {
                        position:'right',
                        ticks:{
                            color:'#484f58', font:{family:"'Space Mono',monospace",size:9},
                            callback: v => {
                                if (v >= 1000000) return 'CHF '+(v/1000000).toFixed(1)+'M';
                                if (v >= 1000)    return 'CHF '+(v/1000).toFixed(0)+'k';
                                return 'CHF '+v;
                            }
                        },
                        grid: { color:'rgba(255,255,255,0.04)' },
                        border:{ color:'rgba(255,255,255,0.07)' }
                    }
                },
                interaction:{ mode:'index', intersect:false }
            }
        });
    }, [chartData, chfRate, btcAmount]);

    // ── Helpers ──────────────────────────────────────────────────
    const fmtUSD = v => '$'+Math.round(v).toLocaleString('es-ES');
    const fmtCHF = v => 'CHF '+Math.round(v).toLocaleString('es-ES');
    const fmtB   = v => {
        if (v >= 1e9) return '$'+(v/1e9).toFixed(2)+'B';
        if (v >= 1e6) return '$'+(v/1e6).toFixed(2)+'M';
        return '$'+v.toLocaleString('es-ES');
    };

    // Fear & Greed config
    const fgConfig = v => {
        if (v <= 24) return { cls:'score-red',    label:'Miedo Extremo',   sem:'sem-red',    color:'#f85149' };
        if (v <= 44) return { cls:'score-red',    label:'Miedo',           sem:'sem-red',    color:'#f97316' };
        if (v <= 55) return { cls:'score-yellow', label:'Neutral',         sem:'sem-yellow', color:'#e3b341' };
        if (v <= 74) return { cls:'score-green',  label:'Codicia',         sem:'sem-green',  color:'#3fb950' };
        return               { cls:'score-green',  label:'Codicia Extrema', sem:'sem-green',  color:'#22c55e' };
    };

    // Mayer Multiple config
    const mayerConfig = m => {
        if (m < 0.8)  return { cls:'score-green',  label:'Infravalorado', sem:'sem-green',  hint:'Zona de acumulación' };
        if (m < 1.5)  return { cls:'score-yellow', label:'Normal',        sem:'sem-yellow', hint:'Zona neutral' };
        return                { cls:'score-red',    label:'Sobrecomprado', sem:'sem-red',    hint:'Precaución' };
    };

    // Weekly RSI config
    const rsiConfig = v => {
        if (v < 30)  return { cls:'score-green',  label:'Sobreventa',    sem:'sem-green',  hint:'Zona de acumulación' };
        if (v < 50)  return { cls:'score-green',  label:'Bajo',          sem:'sem-green',  hint:'Tendencia neutral-bajista' };
        if (v < 60)  return { cls:'score-yellow', label:'Neutral',       sem:'sem-yellow', hint:'Zona neutral' };
        if (v < 75)  return { cls:'score-yellow', label:'Elevado',       sem:'sem-yellow', hint:'Tendencia alcista' };
        return                { cls:'score-red',   label:'Sobrecompra',   sem:'sem-red',    hint:'Precaución' };
    };

    // Realized Price config
    const rpConfig = (rp, current) => {
        if (!rp || !current) return null;
        const ratio = current / rp;
        if (ratio < 1)    return { cls:'score-green',  label:'Por debajo',   sem:'sem-green',  hint:'Precio < Realized Price' };
        if (ratio < 2)    return { cls:'score-yellow', label:'Normal',       sem:'sem-yellow', hint:'1–2× Realized Price' };
        if (ratio < 3.5)  return { cls:'score-yellow', label:'Alcista',      sem:'sem-yellow', hint:'2–3.5× Realized Price' };
        return                    { cls:'score-red',    label:'Euforia',      sem:'sem-red',    hint:`${ratio.toFixed(1)}× Realized Price` };
    };

    const Sparkline = ({ data }) => {
        if (data.length < 2) return null;
        const W=200,H=32,P=2,max=Math.max(...data),min=Math.min(...data),rng=max-min||1;
        const pts = data.map((v,i) =>
            `${(i/(data.length-1))*(W-P*2)+P},${H-((v-min)/rng)*(H-P*2)-P}`
        ).join(' ');
        return (
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H}}>
                <polyline points={pts} fill="none"
                    stroke={data[data.length-1] >= data[0] ? 'var(--green)' : 'var(--red)'}
                    strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
        );
    };

    const CountdownCircle = ({ s, total=10 }) => {
        const sz=34, r=(sz-3)/2, circ=2*Math.PI*r, offset=circ-(s/total)*circ;
        return (
            <div className="countdown-circle">
                <svg className="countdown-svg" width={sz} height={sz}>
                    <circle className="cc-bg"   cx={sz/2} cy={sz/2} r={r}/>
                    <circle className="cc-prog" cx={sz/2} cy={sz/2} r={r} strokeDasharray={circ} strokeDashoffset={offset}/>
                </svg>
                <div className="cc-text">{s}s</div>
            </div>
        );
    };

    // ── RENDER ───────────────────────────────────────────────────
    if (loading && !priceData) {
        return (
            <div className="container">
                <div className="loading-screen">
                    <div className="spinner-lg"></div>
                    <div className="loading-text">Cargando BTC data...</div>
                </div>
            </div>
        );
    }

    const chfPrice    = priceData?.chf ?? (priceData?.usd && chfRate ? priceData.usd * chfRate : null);
    const btcQty      = parseFloat(btcAmount) || 0;
    const currentChf  = priceData?.usd && chfRate ? priceData.usd * chfRate : null;
    const changeClass = c => c > 0 ? 'pos' : c < 0 ? 'neg' : 'neu';
    const changeSign  = c => c > 0 ? '+' : '';

    return (
        <div className="container">

            {/* HEADER */}
            <div className="header">
                <div className="header-left">
                    <div className="btc-badge">₿</div>
                    <div>
                        <div className="header-title">Bitcoin Tracker</div>
                        <div className="header-sub">BTC · USD · CHF</div>
                    </div>
                </div>
                <div className="live-badge"><div className="live-dot"></div>LIVE</div>
            </div>

            {priceError && <div className="error-banner">⚠ {priceError}</div>}

            {priceData && (<>

                {/* MAIN PRICE */}
                <div className="price-section">
                    <div className="price-row">
                        <div>
                            <div className="price-label">PRECIO ACTUAL · USD</div>
                            <div className={`price-usd ${isPulsing?'pop':''} ${trend==='up'?'up':trend==='down'?'down':''}`}>
                                {fmtUSD(priceData.usd)}
                            </div>
                        </div>
                        {chfPrice && (
                            <div className="price-chf-block">
                                <div className="price-label" style={{textAlign:'right'}}>EN CHF</div>
                                <div className="price-chf">{fmtCHF(chfPrice)}</div>
                                {chfRate && <div className="chf-rate-note">1 USD ≈ {chfRate.toFixed(4)} CHF</div>}
                            </div>
                        )}
                    </div>
                    <div className="change-row">
                        <div className={`change-pill ${changeClass(priceData.usd_24h_change)}`}>
                            <span>{priceData.usd_24h_change > 0 ? '▲' : priceData.usd_24h_change < 0 ? '▼' : '●'}</span>
                            {changeSign(priceData.usd_24h_change)}{priceData.usd_24h_change.toFixed(2)}%
                            <span style={{opacity:0.6,fontWeight:400}}>24h</span>
                        </div>
                    </div>
                    {sparkHistory.length > 2 && (
                        <div className="sparkline-row" style={{marginTop:20}}>
                            <span className="sparkline-lbl">SESIÓN</span>
                            <div style={{flex:1}}><Sparkline data={sparkHistory}/></div>
                        </div>
                    )}
                </div>

                {/* STATS */}
                <div className="stats-grid">
                    <div className="stat-card">
                        <div className="stat-label">MKT CAP</div>
                        <div className="stat-value">{fmtB(priceData.usd_market_cap)}</div>
                    </div>
                    <div className="stat-card">
                        <div className="stat-label">VOL 24H</div>
                        <div className="stat-value">{fmtB(priceData.usd_24h_vol)}</div>
                    </div>
                    <div className="stat-card">
                        <div className="stat-label">HIGH 1Y</div>
                        <div className="stat-value" style={{color:'var(--green)'}}>
                            {annualData ? fmtUSD(annualData.high) : <span style={{color:'var(--text-dim)'}}>—</span>}
                        </div>
                    </div>
                    <div className="stat-card">
                        <div className="stat-label">LOW 1Y</div>
                        <div className="stat-value" style={{color:'var(--red)'}}>
                            {annualData ? fmtUSD(annualData.low) : <span style={{color:'var(--text-dim)'}}>—</span>}
                        </div>
                    </div>
                </div>

                {/* INDICATORS — 2×2 grid */}
                <div className="indicators-grid">

                    {/* Fear & Greed */}
                    <div className="indicator-card">
                        <div className="indicator-label">FEAR & GREED INDEX</div>
                        {fearGreed ? (() => {
                            const v = parseInt(fearGreed.value);
                            const cfg = fgConfig(v);
                            return (<>
                                <div className="indicator-main">
                                    <div className={`indicator-score ${cfg.cls}`}>{v}</div>
                                    <div>
                                        <div className="indicator-name">
                                            <span className={`semaphore ${cfg.sem}`}></span>{cfg.label}
                                        </div>
                                        <div className="indicator-sub">/ 100</div>
                                    </div>
                                </div>
                                <div className="fg-bar-wrap">
                                    <div className="fg-bar-track">
                                        <div className="fg-bar-fill" style={{width:`${v}%`,background:cfg.color}}></div>
                                    </div>
                                </div>
                            </>);
                        })() : <div className="indicator-sub" style={{paddingTop:8}}>Cargando...</div>}
                    </div>

                    {/* Mayer Multiple */}
                    <div className="indicator-card">
                        <div className="indicator-label">MAYER MULTIPLE</div>
                        {mayerMult ? (() => {
                            const cfg = mayerConfig(mayerMult);
                            return (
                                <div className="indicator-main">
                                    <div className={`indicator-score ${cfg.cls}`}>{mayerMult.toFixed(2)}</div>
                                    <div>
                                        <div className="indicator-name">
                                            <span className={`semaphore ${cfg.sem}`}></span>{cfg.label}
                                        </div>
                                        <div className="indicator-sub">Precio / MA200</div>
                                        <div className="indicator-sub" style={{marginTop:2}}>{cfg.hint}</div>
                                    </div>
                                </div>
                            );
                        })() : <div className="indicator-sub" style={{paddingTop:8}}>Cargando...</div>}
                    </div>

                    {/* Weekly RSI */}
                    <div className="indicator-card">
                        <div className="indicator-label">WEEKLY RSI (14)</div>
                        {weeklyRSI !== null ? (() => {
                            const v = weeklyRSI;
                            const cfg = rsiConfig(v);
                            // needle position: RSI 0–100 maps to 0–100% of bar
                            return (<>
                                <div className="indicator-main">
                                    <div className={`indicator-score ${cfg.cls}`}>{v.toFixed(1)}</div>
                                    <div>
                                        <div className="indicator-name">
                                            <span className={`semaphore ${cfg.sem}`}></span>{cfg.label}
                                        </div>
                                        <div className="indicator-sub">{cfg.hint}</div>
                                        <div className="indicator-sub" style={{marginTop:2}}>
                                            {v < 30 ? 'Oversold' : v > 70 ? 'Overbought' : 'Rango normal'}
                                        </div>
                                    </div>
                                </div>
                                <div className="rsi-bar-wrap" style={{marginTop:10}}>
                                    <div className="rsi-needle" style={{left:`${v}%`}}></div>
                                </div>
                            </>);
                        })() : <div className="indicator-sub" style={{paddingTop:8}}>Calculando RSI semanal...</div>}
                    </div>

                    {/* Realized Price — manual entry */}
                    <div className="indicator-card">
                        <div className="indicator-label">REALIZED PRICE</div>
                        {(() => {
                            const rpVal = parseFloat(realizedPrice);
                            if (rpVal > 0 && !rpEditing) {
                                const cfg   = rpConfig(rpVal, priceData.usd);
                                const ratio = (priceData.usd / rpVal).toFixed(2);
                                return (<>
                                    <div className="indicator-main">
                                        <div className={`indicator-score ${cfg.cls}`}>{ratio}×</div>
                                        <div style={{flex:1}}>
                                            <div className="rp-value-row">
                                                <div className="indicator-name">
                                                    <span className={`semaphore ${cfg.sem}`}></span>{cfg.label}
                                                </div>
                                                <button className="rp-edit-btn" onClick={() => { setRpDraft(realizedPrice); setRpEditing(true); }}>editar</button>
                                            </div>
                                            <div className="indicator-sub">{fmtUSD(rpVal)}</div>
                                        </div>
                                    </div>
                                    {rpUpdatedAt && <div className="rp-updated">actualizado: {rpUpdatedAt}</div>}
                                </>);
                            }
                            if (rpEditing) {
                                return (<>
                                    <div className="rp-empty">Introduce el Realized Price actual en USD:</div>
                                    <div className="rp-input-row">
                                        <input
                                            className="rp-input"
                                            type="number" placeholder="54785"
                                            value={rpDraft}
                                            onChange={e => setRpDraft(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && saveRealizedPrice()}
                                            autoFocus
                                        />
                                        <button className="rp-save-btn" onClick={saveRealizedPrice}>OK</button>
                                    </div>
                                    <div className="rp-updated" style={{marginTop:6}}>Fuente recomendada: MacroMicro / Glassnode</div>
                                </>);
                            }
                            return (<>
                                <div className="rp-empty">Sin datos · actualiza una vez al mes</div>
                                <div className="rp-input-row">
                                    <input
                                        className="rp-input"
                                        type="number" placeholder="54785"
                                        value={rpDraft}
                                        onChange={e => setRpDraft(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && saveRealizedPrice()}
                                    />
                                    <button className="rp-save-btn" onClick={saveRealizedPrice}>OK</button>
                                </div>
                                <div className="rp-updated" style={{marginTop:6}}>Fuente: MacroMicro / Glassnode</div>
                            </>);
                        })()}
                    </div>

                </div>

                {/* PORTFOLIO */}
                <div className="portfolio-section">
                    <div className="portfolio-header">
                        <div className="portfolio-title">Mi Portfolio BTC</div>
                        <div className="btc-input-wrap">
                            <span className="btc-input-label">₿</span>
                            <input
                                className="btc-input"
                                type="number" min="0" step="0.0001" placeholder="0.0000"
                                value={btcAmount}
                                onChange={e => setBtcAmount(e.target.value)}
                            />
                        </div>
                    </div>
                    {btcQty > 0 && chfRate ? (
                        <div className="portfolio-values">
                            <div className="portfolio-val-card chf-val">
                                <div className="portfolio-val-label">VALOR EN CHF</div>
                                <div className="portfolio-val-amount">{fmtCHF(btcQty * priceData.usd * chfRate)}</div>
                                <div className="portfolio-val-sub">{btcAmount} BTC × {fmtCHF(Math.round(priceData.usd * chfRate))}</div>
                            </div>
                            <div className="portfolio-val-card usd-val">
                                <div className="portfolio-val-label">VALOR EN USD</div>
                                <div className="portfolio-val-amount">{fmtUSD(btcQty * priceData.usd)}</div>
                                <div className="portfolio-val-sub">{btcAmount} BTC × {fmtUSD(priceData.usd)}</div>
                            </div>
                        </div>
                    ) : (
                        <div className="portfolio-empty">Introduce tus BTC para ver el valor →</div>
                    )}
                </div>

                {/* DCA LEVELS */}
                {currentChf && (
                    <div className="dca-section">
                        <div className="dca-header">
                            <div className="dca-title">Niveles DCA</div>
                            <div className="dca-subtitle">Actual: {fmtCHF(currentChf)}</div>
                        </div>
                        <div className="dca-levels">
                            {dcaLevels.map((lvlStr, idx) => {
                                const lvlPrice = parseFloat(lvlStr) || 0;
                                const reached  = lvlPrice > 0 && currentChf <= lvlPrice;
                                const empty    = lvlPrice === 0;

                                // Progress bar: 100% = at target, tapers off as price is higher
                                const fill = empty ? 0 : reached ? 100 : Math.max(4, Math.min(96,
                                    100 - ((currentChf - lvlPrice) / (currentChf * 0.6)) * 100
                                ));
                                const pctAway = empty
                                    ? '—'
                                    : reached
                                        ? '✓ NIVEL'
                                        : `-${(((currentChf - lvlPrice) / currentChf) * 100).toFixed(1)}%`;

                                return (
                                    <div key={idx} className={`dca-level ${reached ? 'reached' : ''}`}>
                                        {/* Left: editable price input */}
                                        <div>
                                            <div className="dca-input-wrap">
                                                <span className="dca-currency-lbl">CHF</span>
                                                <input
                                                    className="dca-price-input"
                                                    type="number" min="0" step="1000"
                                                    placeholder="precio"
                                                    value={lvlStr}
                                                    onChange={e => updateDcaLevel(idx, e.target.value)}
                                                />
                                            </div>
                                        </div>
                                        {/* Middle: bar + pct */}
                                        <div>
                                            <div className="dca-bar-track">
                                                <div className="dca-bar-fill" style={{width:`${fill}%`}}></div>
                                            </div>
                                            <div className="dca-pct-row" style={{marginTop:4}}>
                                                <div className="dca-pct" style={{color: reached ? 'var(--green)' : empty ? 'var(--text-dim)' : 'var(--yellow)'}}>
                                                    {pctAway}
                                                </div>
                                            </div>
                                        </div>
                                        {/* Right: action */}
                                        <div className="dca-action">
                                            {reached ? '✓ Comprar 1 BTC' : 'Comprar 1 BTC'}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                )}

                {/* PORTFOLIO CHART */}
                <div className="chart-section">
                    <div className="chart-header">
                        <div>
                            <div className="chart-title">Portfolio · 1 Año en CHF</div>
                            <div className="chart-subtitle">
                                {btcQty > 0
                                    ? `${btcAmount} BTC · evolución últimos 365 días`
                                    : '1 BTC de referencia · introduce tu cantidad arriba'}
                            </div>
                        </div>
                    </div>
                    <div className="chart-wrapper">
                        {chartLoading && (
                            <div className="chart-loading">
                                <div className="mini-spinner"></div>
                                Cargando histórico...
                            </div>
                        )}
                        <canvas ref={canvasRef} style={{opacity:chartLoading?0.15:1,transition:'opacity 0.3s'}}/>
                    </div>
                </div>

                {/* FOOTER */}
                <div className="footer-bar">
                    <div className="update-info">
                        <div className="live-dot" style={{background:'var(--green)'}}></div>
                        {lastUpdate ? lastUpdate.toLocaleTimeString('es-ES') : '—'}
                    </div>
                    <div className="countdown-wrap">
                        <span>próx. actualización</span>
                        <CountdownCircle s={countdown}/>
                    </div>
                </div>

            </>)}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BTCTracker/>);
</script>
</body>
</html>
